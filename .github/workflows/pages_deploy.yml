name: Deploy site to GitHub Pages

# Builds the static site with `python3 web/build_site.py` and serves it as
# the repo's GitHub Pages site via the modern Pages-Actions flow (no `docs/`
# tree committed to git).
#
# Prerequisite (one-time, done via GitHub UI):
#   Settings → Pages → Source: "GitHub Actions"
#
# Triggers:
#   - push to swh-evidence-v1 (the prototype branch)
#   - manual workflow_dispatch (any branch, from the Actions tab)
#
# Build artefact:
#   - `web/dist/` — the static site (~13,755 PL pages + 8,344 ext pages +
#     /samples, /source, /review, /stats, /audit ; ~170 MB).
#
# SWH popularity data:
#   - `data/derived/swh_extensions_popularity.csv.gz` is committed (~22 MB
#     gzipped, per-ext aggregate from the SWH 2026-06-04 export). If it is
#     missing, the build degrades gracefully: SWH-popularity panels render
#     empty / "—" and the /ext/ index sorts alphabetically.

on:
  push:
    branches:
      - swh-evidence-v1
  workflow_dispatch:
  # Auto-chain: when the ingest workflow finishes (after a label submission
  # has been parsed + committed to swh-evidence-v1), rebuild and redeploy
  # the public site so the new label appears within minutes. Necessary
  # because GitHub's anti-loop protection prevents bot-pushed commits from
  # triggering other workflows directly.
  workflow_run:
    workflows: ["Ingest extension-label issues", "Ingest file reviews"]
    types: [completed]
    branches: [swh-evidence-v1]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # When triggered by a workflow_run (chained from the ingest workflow),
    # only proceed if the upstream ingest actually succeeded. Failed ingests
    # leave the data in a half-committed state and a rebuild would just
    # propagate the broken state to the public site.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pin to swh-evidence-v1 regardless of how we were triggered.
          # `workflow_run` events default to the default branch (main) — we
          # need to deploy the prototype branch's content.
          ref: swh-evidence-v1
          # Full history is required by build_site.py:
          #   - read_turns_from_git() — populates lang.turn_commit /
          #     agent / model / WebSearch pills from `turn: add` commits.
          #   - index_program_provenance_from_git() — per-program
          #     attribution by walking `git log --all --diff-filter=A`.
          # Default `actions/checkout@v4` is depth=1 (tip only), which
          # silently empties both maps — pages then render without any
          # LLM provenance even though the source files carry it.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pygments
          # duckdb is only required to regenerate swh_extensions_popularity.csv.gz
          # from the source CSV; the build step doesn't need it.

      - name: Rebuild PL taxonomy (promote accepted ext labels into ext_claim.csv)
        # extension_labels.csv is updated by ingest_ext_labels.yml (for
        # ext-review issues) and by pl_contribute_pr.yml's PR (for
        # pl-contribute issues). Neither chains back to rebuild the
        # taxonomy artefacts that build_site.py reads. Running this here
        # makes the deploy self-contained: every checked-in label row
        # gets promoted into ext_claim.csv / ext_summary.csv before the
        # site is rendered. Stdlib-only, ~5s on this repo.
        run: python3 tools/build_pl_taxonomy.py

      - name: Build PL concepts (curated same_as decisions -> concepts)
        # Joins records of the rebuilt taxonomy + languages/ into concepts
        # from data/curated/pl_links.csv (docs/PL_IDENTITY.md). Fails if a
        # decision points at a record that no longer exists: such a
        # decision must be re-reviewed, not silently dropped. Stdlib-only.
        run: python3 tools/build_pl_concepts.py build

      - name: Build site
        run: python3 web/build_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
