// FizzBuzz in CubeScript (Sauerbraten scripting language)
alias fizzbuzz [
    loop i 20 [
        local n
        n = (+ $i 1)
        if (&& (= (mod $n 3) 0) (= (mod $n 5) 0)) [
            echo "FizzBuzz"
        ] [
            if (= (mod $n 3) 0) [
                echo "Fizz"
            ] [
                if (= (mod $n 5) 0) [
                    echo "Buzz"
                ] [
                    echo $n
                ]
            ]
        ]
    ]
]

fizzbuzz
