name: Submit file reviews
description: Reviews made on the online review page (which language is this archived file written in?)
title: "[review] "
labels: ["review"]
body:
  - type: markdown
    attributes:
      value: |
        This form is filled in by the **review page** of PL-ultimate-llm
        (`/review/study/<study>/` on the site). Just press **Submit new issue**.

        A bot records each review in the repository's review store
        (`reviews/`, see `docs/reviews.md`), then replies here with how the
        study's LLM judges labelled the same files. A first-time reviewer's
        batch is ingested once a maintainer approves it.
  - type: textarea
    id: reviews
    attributes:
      label: Reviews (JSON, generated by the review page — please do not edit)
      render: json
    validations:
      required: true
