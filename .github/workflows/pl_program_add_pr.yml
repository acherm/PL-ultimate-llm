name: Auto-PR for pl-program-add issues

# Materializes a `pl-program-add` GitHub issue (submitted via the
# "Submit a program" form on /l/<slug>/ pages) into program files for an
# existing PL, then opens a draft pull request from a feature branch.
# Maintainers review the PR before merge.
#
# Triggers:
#   - issues.labeled / opened (when the `pl-program-add` label lands)
#   - workflow_dispatch (manual rerun with the issue number)
#
# Pipeline:
#   1. Check out swh-evidence-v1 (same pin rationale as pl_add_pr.yml —
#      the processor script lives on this branch).
#   2. Run `tools/process_pl_program_addition.py --issue <N>`:
#      writes `languages/<folder>/programs/<sha256>/{code.<ext>,manifest.json}`.
#   3. Stage the changes on a `pl-program-add/<folder>-issue-<N>` branch.
#   4. Push + open a draft PR linked to the issue.
#
# Notes:
#   - The default GITHUB_TOKEN can open PRs against the same repo with
#     `permissions: pull-requests: write`.
#   - Workflow does NOT auto-merge. A maintainer reviews the PR (sanity-
#     checks the origin URL, that the code is a verbatim copy, license).
#   - Refuses to overwrite an existing program sha (returns exit 2).

on:
  issues:
    types: [opened, labeled, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to materialize"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  open_pr:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'pl-program-add' ||
      contains(join(github.event.issue.labels.*.name, ','), 'pl-program-add')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: swh-evidence-v1
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve issue number
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "issue=${{ github.event.inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "issue=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run process_pl_program_addition.py
        id: process
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/process_pl_program_addition.py --issue ${{ steps.resolve.outputs.issue }}
          summary=".tmp/pl_program_add_summary_${{ steps.resolve.outputs.issue }}.json"
          pl_name=$(python3 -c "import json;d=json.load(open('$summary'));print(d['pl_name'])")
          pl_folder=$(python3 -c "import json;d=json.load(open('$summary'));print(d['pl_folder'])")
          sha=$(python3 -c "import json;d=json.load(open('$summary'));print(d['program_sha256'])")
          title=$(python3 -c "import json;d=json.load(open('$summary'));print(d['program_title'])")
          ext=$(python3 -c "import json;d=json.load(open('$summary'));print(d['program_ext'])")
          origin=$(python3 -c "import json;d=json.load(open('$summary'));print(d['origin_url'])")
          echo "pl_name=$pl_name"     >> "$GITHUB_OUTPUT"
          echo "pl_folder=$pl_folder" >> "$GITHUB_OUTPUT"
          echo "sha=$sha"             >> "$GITHUB_OUTPUT"
          echo "title=$title"         >> "$GITHUB_OUTPUT"
          echo "ext=$ext"             >> "$GITHUB_OUTPUT"
          echo "origin=$origin"       >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create feature branch + commit
        id: branch
        run: |
          branch="pl-program-add/${{ steps.process.outputs.pl_folder }}-issue-${{ steps.resolve.outputs.issue }}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git checkout -b "$branch"
          git add -A languages/
          if git diff --cached --quiet; then
            echo "No changes to commit — nothing to PR."
            exit 0
          fi
          git commit -m "pl-program-add: ${{ steps.process.outputs.pl_name }} — ${{ steps.process.outputs.title }} (from issue #${{ steps.resolve.outputs.issue }})

          Materialized via tools/process_pl_program_addition.py from the
          /l/<slug>/ \"Submit a program\" form submission.

          Resolves #${{ steps.resolve.outputs.issue }}"
          git push origin "$branch"

      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body_file=$(mktemp)
          cat > "$body_file" <<EOF
          Materializes the \`pl-program-add\` issue #${{ steps.resolve.outputs.issue }} into:
          - \`languages/${{ steps.process.outputs.pl_folder }}/programs/${{ steps.process.outputs.sha }}/code${{ steps.process.outputs.ext }}\`
          - \`languages/${{ steps.process.outputs.pl_folder }}/programs/${{ steps.process.outputs.sha }}/manifest.json\`

          ## Review checklist
          - [ ] Origin URL resolves: ${{ steps.process.outputs.origin }}
          - [ ] Code is a verbatim copy from that URL (not invented, not paraphrased).
          - [ ] Program is non-trivial (3+ meaningful lines) and under ~200 lines.
          - [ ] License guess matches the source repository.
          - [ ] Extension matches the language (per the PL's claimed extensions or this submission's intent).

          Resolves #${{ steps.resolve.outputs.issue }}
          EOF
          gh pr create \
            --draft \
            --base swh-evidence-v1 \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "pl-program-add: ${{ steps.process.outputs.pl_name }} — ${{ steps.process.outputs.title }} (issue #${{ steps.resolve.outputs.issue }})" \
            --body-file "$body_file" \
            --label pl-program-add
